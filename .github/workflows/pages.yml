name: Website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'
  CF_SEND_TELEMETRY: 'false'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the project npm version
        run: |
          project_npm="$(node -p 'require("./package.json").packageManager')"
          if [[ ! "$project_npm" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' 'package.json must pin an npm version in packageManager.' >&2
            exit 1
          fi
          if [ "npm@$(npm --version)" != "$project_npm" ]; then
            npm install --global "$project_npm" --ignore-scripts --no-audit --no-fund
          fi
          test "npm@$(npm --version)" = "$project_npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and check the website
        run: npm run site:check

      - name: Upload checked website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .vitepress/dist

  deploy:
    name: Publish website
    needs: build
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: syndicord-website
      cancel-in-progress: false
    steps:
      - name: Check the current main revision
        id: current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_head" = "$GITHUB_SHA" ]; then
            printf '%s\n' 'publish=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'A newer main revision exists; skipping this deployment.'
          fi

      - name: Deploy the checked website
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
